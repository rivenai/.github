# Reusable CI workflow scaffold for Python and Node repos
#
# Callers invoke with:
#   jobs:
#     ci:
#       uses: rivenai/.github/.github/workflows/reusable-ci.yml@main
#       with:
#         language: python   # or: node
#         language-version: "3.12"
#         test-command: "make test"
#         lint-command: "make lint"
#       secrets: inherit

name: reusable-ci

on:
  workflow_call:
    inputs:
      language:
        description: "python or node"
        type: string
        required: true
      language-version:
        description: "Python version (e.g. 3.12) or Node version (e.g. 20)"
        type: string
        required: true
      test-command:
        description: "Shell command to run the test suite"
        type: string
        required: false
        default: "echo 'no test command supplied' && exit 1"
      lint-command:
        description: "Shell command to run linters"
        type: string
        required: false
        default: "echo 'no lint command supplied'"
      working-directory:
        description: "Working directory for steps"
        type: string
        required: false
        default: "."

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.language-version }}
          cache: pip

      - name: Install Python deps
        if: inputs.language == 'python'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e "."; fi

      - name: Setup Node
        if: inputs.language == 'node'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.language-version }}
          cache: npm

      - name: Install Node deps
        if: inputs.language == 'node'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: ${{ inputs.lint-command }}

      - name: Test
        run: ${{ inputs.test-command }}
