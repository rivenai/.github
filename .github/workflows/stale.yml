# Stale issue/PR reaper for rivenai/.github
#
# Runs daily, marks inactive issues/PRs as stale, then closes them after a grace
# period. Excludes anything labeled security, pinned, or in-progress.
#
# This workflow lives in rivenai/.github and only acts on this repo. To enable
# org-wide, copy this file (or call it as a reusable workflow) from each repo.

name: stale

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "security,pinned,in-progress,governance"
          exempt-pr-labels: "security,pinned,in-progress,governance"
          stale-issue-message: |
            This issue has been inactive for 60 days. It will be closed in 14 days
            unless there is new activity. If still relevant, add a comment or
            remove the `stale` label.
          stale-pr-message: |
            This pull request has been inactive for 30 days. It will be closed in
            14 days unless there is new activity.
          close-issue-message: |
            Closing due to inactivity. Reopen if this is still relevant.
          close-pr-message: |
            Closing due to inactivity. Reopen and rebase to continue.
          operations-per-run: 100
